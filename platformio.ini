; ESP32-C3 SuperMini + capacitive soil moisture sensor (v2.0 / HW-390)
; PIN_SENSOR_ADC   : sensor AOUT (ADC1: GPIO0-4)
; PIN_SENSOR_POWER1/2 : sensor VCC is fed by two GPIOs in parallel (one alone drops the voltage too much)
; PIN_SUPPLY_ADC   : 5V pin via 100k/100k divider (+100n): USB detection and battery voltage
; GPIO usage on the ESP32-C3 SuperMini (GPIO0-10, 20, 21 are broken out):
;   Measure supply voltage (PIN_SUPPLY_ADC) and sensor AOUT (PIN_SENSOR_ADC): ADC1 only = GPIO0-4.
;       Allowed: 0,1,3,4 (GPIO2 is a strapping pin: only with a high-impedance, non-pulling-down divider).
;       Forbidden: GPIO5 (ADC2, unusable with WiFi/BLE) and all non-ADC pins (6-10, 20, 21).
;   Drive sensor VCC (PIN_SENSOR_POWER1/2, two GPIOs in parallel, must be real outputs):
;       Allowed: 3, 4, 5, 6, 7, 10 (and 0/1 if not otherwise used).
;       Forbidden: GPIO2, 8, 9 (strapping pins, level at reset decides boot mode; 8 also drives the onboard LED,
;       9 is the BOOT button), GPIO18/19 (USB D-/D+), GPIO20/21 (UART0).
;   Do not assign one pin to two functions.
; PIN_BUTTON       : button to GND, wakes from deep sleep (RTC GPIO 0-5) -> config portal
[platformio]
default_envs = supermini-debug

[env:supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D PIN_BUTTON=0
    -D PIN_SUPPLY_ADC=1
    -D PIN_SENSOR_ADC=4
    -D PIN_SENSOR_POWER1=3
    -D PIN_SENSOR_POWER2=7


; Development: serial log (DEBUG_LOG) and config portal on every start (DEBUG_FORCE_PORTAL)
[env:supermini-debug]
extends = env:supermini
build_flags =
    ${env:supermini.build_flags}
    -D DEBUG_ALL
    -D DEBUG_LOG
    -D DEBUG_FORCE_PORTAL
    -D DEBUG_LED
    -D DEBUG_FORCE_SEND
