; ESP32-C3 SuperMini + capacitive soil moisture sensor (v2.0 / HW-390)
; PIN_SENSOR_ADC   : sensor AOUT (must be an ADC1 pin: GPIO0-4)
; PIN_SENSOR_POWER : sensor VCC is switched by this GPIO (saves ~5 mA)
; PIN_BATTERY_ADC  : battery via 2x 100k divider, -1 = disabled
; PIN_CONFIG       : pull to GND while resetting -> config portal
[env:supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D PIN_SENSOR_ADC=2
    -D PIN_SENSOR_POWER=3
    -D PIN_BATTERY_ADC=4
    -D PIN_CONFIG=10
