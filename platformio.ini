; ESP32-C3 SuperMini + capacitive soil moisture sensor (v2.0 / HW-390)
; PIN_SENSOR_ADC   : sensor AOUT (ADC1: GPIO0-4)
; PIN_SENSOR_POWER : sensor VCC is switched by this GPIO (saves ~5 mA)
; PIN_SUPPLY_ADC   : 5V pin via 100k/100k divider (+100n): USB detection and battery voltage
; PIN_BUTTON       : button to GND, wakes from deep sleep (RTC GPIO 0-5) -> config portal
[env:supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D PIN_BUTTON=0
    -D PIN_SUPPLY_ADC=1
    -D PIN_SENSOR_ADC=2
    -D PIN_SENSOR_POWER=3
